<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planta en 3D</title>
<style>
:root{--fg:#2b2b2b;--chip:rgba(255,255,255,.88);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fg:#eee;--chip:rgba(30,34,36,.88)}}
:root[data-theme="dark"]{--fg:#eee;--chip:rgba(30,34,36,.88)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap}
#hud button{background:var(--chip);color:var(--fg);border:0;border-radius:10px;padding:8px 12px;font:14px Georgia,serif}
</style>
</head>
<body>
<div id="hud"><button id="v1">Aérea</button><button id="v2">Sala</button><button id="v3">Dormitorios</button><button id="vw">Paredes: completas</button><button id="vl">Rótulos</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(dark?0x1c1f21:0xd5dde2);
const cam=new THREE.PerspectiveCamera(50,1,.1,90);
const C=new THREE.Vector3(6.27,0,6.15);
scene.add(new THREE.HemisphereLight(0xffffff,0x9a9488,.8));
const sun=new THREE.DirectionalLight(0xfff2dc,.75);sun.position.set(C.x+7,14,C.z+5);sun.target.position.copy(C);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:40});sun.shadow.bias=-.0005;

const rnd=Math.random;
function tex(s,f){const c=document.createElement('canvas');c.width=c.height=s;f(c.getContext('2d'),s);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t}
const woodT=tex(512,(g,s)=>{const n=8,h=s/n;for(let i=0;i<n;i++){g.fillStyle=`hsl(28,${38+rnd()*8}%,${46+rnd()*10}%)`;g.fillRect(0,i*h,s,h);for(let k=0;k<40;k++){g.strokeStyle=`rgba(70,40,20,${.05+rnd()*.12})`;const y=i*h+rnd()*h;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(s*.3,y+rnd()*4-2,s*.6,y+rnd()*4-2,s,y);g.stroke()}g.fillStyle='rgba(30,15,5,.5)';g.fillRect(0,i*h,s,2);g.fillRect(rnd()*s,i*h,2,h)}});
const tileT=tex(256,(g,s)=>{g.fillStyle='#d9d5cd';g.fillRect(0,0,s,s);for(let i=0;i<1500;i++){g.fillStyle=rnd()<.5?'rgba(255,255,255,.06)':'rgba(120,110,100,.06)';g.fillRect(rnd()*s,rnd()*s,3,3)}g.strokeStyle='#a9a49b';g.lineWidth=4;g.strokeRect(0,0,s,s);g.beginPath();g.moveTo(s/2,0);g.lineTo(s/2,s);g.moveTo(0,s/2);g.lineTo(s,s/2);g.stroke()});
const concT=tex(256,(g,s)=>{g.fillStyle='#a3a19c';g.fillRect(0,0,s,s);for(let i=0;i<2500;i++){g.fillStyle=`rgba(${rnd()<.5?255:60},${rnd()<.5?255:60},${rnd()<.5?255:60},.07)`;g.fillRect(rnd()*s,rnd()*s,2+rnd()*3,2+rnd()*3)}g.strokeStyle='rgba(60,60,60,.35)';g.lineWidth=2;g.strokeRect(0,0,s,s)});
const grassT=tex(256,(g,s)=>{g.fillStyle='#7d9a63';g.fillRect(0,0,s,s);for(let i=0;i<4000;i++){g.fillStyle=`hsla(${85+rnd()*30},${30+rnd()*20}%,${30+rnd()*20}%,.5)`;g.fillRect(rnd()*s,rnd()*s,2,4)}});
const granT=tex(128,(g,s)=>{g.fillStyle='#1e1c1c';g.fillRect(0,0,s,s);for(let i=0;i<500;i++){g.fillStyle=`rgba(255,255,255,${rnd()*.35})`;g.fillRect(rnd()*s,rnd()*s,1.5,1.5)}});

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o));
function Bx(x0,z0,x1,z1,y0,y1,mat,p=scene){const m=new THREE.Mesh(new THREE.BoxGeometry((x1-x0)/100,(y1-y0)/100,(z1-z0)/100),mat);m.position.set((x0+x1)/200,(y0+y1)/200,(z0+z1)/200);m.castShadow=m.receiveShadow=true;p.add(m);return m}
function Ell(cx,cz,rx,rz,y0,y1,m){const g=new THREE.Mesh(new THREE.CylinderGeometry(1,1,(y1-y0)/100,32),m);g.scale.set(rx/100,1,rz/100);g.position.set(cx/100,(y0+y1)/200,cz/100);g.castShadow=g.receiveShadow=true;scene.add(g)}
function fl(x0,z0,x1,z1,t,tile,r=.5){const tt=t.clone();tt.needsUpdate=true;tt.repeat.set((x1-x0)/tile,(z1-z0)/tile);const m=new THREE.Mesh(new THREE.PlaneGeometry((x1-x0)/100,(z1-z0)/100),new THREE.MeshStandardMaterial({map:tt,roughness:r}));m.rotation.x=-Math.PI/2;m.position.set((x0+x1)/200,.004,(z0+z1)/200);m.receiveShadow=true;scene.add(m)}
function clad(x0,z0,x1,z1){const t=tileT.clone();t.needsUpdate=true;t.repeat.set(Math.max(x1-x0,z1-z0)/120,1.8);Bx(x0,z0,x1,z1,0,215,new THREE.MeshStandardMaterial({map:t,roughness:.3}))}

// Terreno
const gt=grassT.clone();gt.needsUpdate=true;gt.repeat.set(30,30);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({map:gt,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(C.x,-.201,C.z);ground.receiveShadow=true;scene.add(ground);
const slab=M(0x9b9893);
[[0,0,427,1230],[827,0,1254,1230],[427,412,827,687],[427,687,827,1031],[692,0,827,412]].forEach(a=>Bx(a[0],a[1],a[2],a[3],-20,0,slab));

// Muros
const H=250,walls=new THREE.Group();scene.add(walls);
const wallM=M(0xf0ede6,{roughness:.95}),glassM=M(0x9cc7d8,{transparent:true,opacity:.3,roughness:.05,metalness:.2}),frameM=M(0x2a2d2f,{metalness:.5,roughness:.4});
function W(x0,z0,x1,z1,ops=[]){const hor=(x1-x0)>(z1-z0),s=hor?x0:z0,e=hor?x1:z1,mid=hor?(z0+z1)/2:(x0+x1)/2;
  const P=(a,b,y0,y1,m,t=2)=>hor?Bx(a,mid-t,b,mid+t,y0,y1,m,walls):Bx(mid-t,a,mid+t,b,y0,y1,m,walls);
  const S=(a,b,y0,y1)=>{if(b>a&&y1>y0)hor?Bx(a,z0,b,z1,y0,y1,wallM,walls):Bx(x0,a,x1,b,y0,y1,wallM,walls)};
  let c=s;ops.slice().sort((p,q)=>p.a-q.a).forEach(o=>{S(c,o.a,0,H);S(o.a,o.b,0,o.sill);S(o.a,o.b,o.top,H);
    if(o.g){P(o.a,o.b,o.sill,o.top,glassM,1).castShadow=false;[[o.a,o.a+4,o.sill,o.top],[o.b-4,o.b,o.sill,o.top],[o.a,o.b,o.sill,o.sill+4],[o.a,o.b,o.top-4,o.top],[(o.a+o.b)/2-2,(o.a+o.b)/2+2,o.sill,o.top]].forEach(q=>P(q[0],q[1],q[2],q[3],frameM,4))}
    c=o.b});S(c,e,0,H)}
const D=(a,b)=>({a,b,sill:0,top:210}),G=(a,b,s=90)=>({a,b,sill:s,top:210,g:1});
// Ala izquierda
W(0,0,427,15);W(0,1215,427,1230);W(0,15,15,1215);W(415,15,427,1215,[G(504,624)]);
W(15,439,415,451,[D(205,295),D(325,415)]);W(15,620,295,632);W(15,802,415,814,[D(325,415)]);W(295,439,307,802,[D(722,802)]);
// Centro
W(427,412,839,424,[G(434,676),D(711,821)]);Bx(676,400,707,424,0,H,wallM,walls);
W(427,675,839,687,[G(566,808)]);Bx(692,0,707,15,0,H,wallM,walls);
// Ala derecha
W(827,0,1254,15);W(827,1215,1254,1230);W(1239,15,1254,1215);W(827,15,839,1215,[G(555,675,60),G(715,915)]);W(839,973,1239,985,[D(939,1039)]);

// Pisos y revestimientos
fl(15,15,415,439,woodT,160);fl(15,814,415,1215,woodT,160);fl(839,985,1239,1215,woodT,160);
[[15,452,295,620],[15,632,295,802],[307,451,415,802],[427,424,827,675]].forEach(a=>fl(a[0],a[1],a[2],a[3],tileT,120,.3));
fl(839,15,1239,973,concT,200,.4);fl(692,0,827,412,concT,150,.9);fl(427,687,827,1031,concT,150,.9);
clad(15,452,17,620);clad(17,618,295,620);clad(15,632,17,802);clad(17,632,295,634);

// Materiales de muebles
const wh=M(0xf4f2ee,{roughness:.4}),brn=M(0x3b302e,{roughness:.45}),blk=M(0x101010,{roughness:.35}),bwood=M(0x6e4a32,{roughness:.6}),lin=M(0xf3f1ec,{roughness:1}),duv=M(0x7f7a7a,{roughness:1}),fab=M(0xd9d5ce,{roughness:1}),gry=M(0x888888,{roughness:.6}),gran=new THREE.MeshStandardMaterial({map:granT,roughness:.25,metalness:.15}),steel=M(0xc0c4c8,{metalness:.8,roughness:.3});
function closet(x0,z0,x1,z1,n,h,hor){const w=((hor?x1-x0:z1-z0))/n;for(let i=0;i<n;i++)hor?Bx(x0+i*w+.5,z0,x0+(i+1)*w-.5,z1,0,h,wh):Bx(x0,z0+i*w+.5,x1,z0+(i+1)*w-.5,0,h,wh)}
function chair(cx,cz,d,m,h=92){Bx(cx-21,cz-21,cx+21,cz+21,42,46,m);[[-18,-18],[18,-18],[-18,18],[18,18]].forEach(a=>Bx(cx+a[0]-2,cz+a[1]-2,cx+a[0]+2,cz+a[1]+2,0,42,m));
  const b={n:[-21,-25,21,-19],s:[-21,19,21,25],w:[-25,-21,-19,21],e:[19,-21,25,21]}[d];Bx(cx+b[0],cz+b[1],cx+b[2],cz+b[3],46,h,m)}
// Dormitorio 1
closet(15,15,415,65,4,240,1);Bx(15,95,65,145,0,50,wh);Bx(15,345,65,395,0,50,wh);
Bx(15,140,21,350,0,115,bwood);Bx(21,145,214,345,0,26,bwood);Bx(23,147,212,343,26,48,lin);Bx(70,147,212,343,48,53,duv);Bx(26,155,56,242,48,60,lin);Bx(26,248,56,335,48,60,lin);
// Dormitorio 2
closet(15,814,315,864,3,240,1);Bx(15,925,65,975,0,50,wh);Bx(15,1136,65,1186,0,50,wh);
Bx(15,970,21,1141,0,115,bwood);Bx(21,975,214,1136,0,26,bwood);Bx(23,977,212,1134,26,48,lin);Bx(70,977,212,1134,48,53,duv);Bx(26,985,56,1045,48,60,lin);Bx(26,1068,56,1128,48,60,lin);
// Baños
[[452,620,554,611,606,581,620],[632,802,646,700,634,633,672]].forEach((b,i)=>{
  Bx(15,b[0]+(i?3:0),94,b[1],0,55,wh);Bx(20,b[0]+(i?8:5),89,b[1]-(i?5:3),42,56,M(0xdde5e9));
  Bx(129,b[3],164,b[3]+(i?54:52),0,42,wh);Bx(133,i?634:606,160,i?648:620,0,85,wh);
  Bx(204,b[5],265,b[6],0,85,bwood);Bx(204,b[5],265,b[6],85,88,wh);Bx(212,b[5]+7,258,b[6]-7,88,92,wh)});
// Patio-comedor: cocina auxiliar, mesa y sillas
Bx(427,687,487,868,0,90,wh);Bx(427,687,487,868,90,93,gran);Bx(435,740,480,800,93,94,blk);
Ell(644,855,36,50,72,76,wh);Ell(644,855,5,5,0,72,wh);
[[579,780,'e'],[700,755,'w'],[585,933,'e'],[706,937,'w']].forEach(a=>chair(a[0],a[1],a[2],wh,85));
// Sala: sofá en L, mesa de centro, loveseat
Bx(839,55,865,255,0,80,wh);Bx(839,55,865,255,80,83,bwood);
Bx(1004,40,1214,99,0,42,fab);Bx(1155,99,1214,250,0,42,fab);Bx(1004,15,1239,40,0,88,fab);Bx(1214,40,1239,250,0,88,fab);
Bx(1006,45,1210,95,42,55,fab);Bx(1160,100,1210,245,42,55,fab);Bx(990,20,1004,95,0,45,wh);
Bx(989,145,1115,215,0,38,M(0xeeeeee,{roughness:.2}));
Bx(990,265,1150,332,0,42,fab);Bx(990,332,1150,355,0,85,fab);Bx(975,265,990,355,0,60,fab);Bx(1150,265,1166,355,0,60,fab);Bx(992,270,1148,330,42,52,fab);
// Comedor
Bx(985,440,1167,559,72,76,brn);[[990,445],[1150,445],[990,545],[1150,545]].forEach(a=>Bx(a[0],a[1],a[0]+12,a[1]+12,0,72,brn));
[[1031,428,'n'],[1115,428,'n'],[1031,572,'s'],[1118,572,'s'],[975,500,'w'],[1177,500,'e']].forEach(a=>chair(a[0],a[1],a[2],blk));
// Isla, taburetes y cocina
Bx(979,735,1239,775,0,92,brn);Bx(975,731,1239,779,92,96,gran);
[1011,1076,1141,1206].forEach(x=>{Ell(x,712,19,19,66,71,gry);Ell(x,712,3,3,0,66,blk)});
Bx(1190,773,1239,834,0,190,blk);Bx(1180,834,1239,973,0,90,brn);Bx(1180,834,1239,973,90,94,gran);
Bx(959,913,1180,973,0,90,brn);Bx(959,913,1180,973,90,94,gran);Bx(959,913,1030,973,0,210,blk);Bx(1060,925,1130,960,92,96,steel);
Bx(1050,960,1140,973,96,125,blk);
// Oficina
Bx(1004,1155,1239,1215,72,76,M(0xbdbdbd,{roughness:.4}));Bx(1180,1045,1239,1155,72,76,M(0xbdbdbd,{roughness:.4}));
[[1008,1159],[1008,1200],[1225,1200],[1225,1050]].forEach(a=>Bx(a[0],a[1],a[0]+8,a[1]+8,0,72,gry));
closet(1180,985,1239,1045,1,200,0);Bx(839,1163,1004,1215,0,90,wh);
Bx(1100,1110,1150,1160,42,46,blk);Bx(1100,1157,1150,1162,46,95,blk);Bx(1100,1110,1150,1115,0,42,blk);
Bx(1070,1185,1150,1189,76,112,blk);Bx(1090,1175,1130,1180,76,78,blk);

// Rótulos
const labels=new THREE.Group();labels.visible=false;scene.add(labels);
function label(t,x,z){const c=document.createElement('canvas');c.width=512;c.height=96;const g=c.getContext('2d');g.font='bold 40px Georgia';g.textAlign='center';g.lineWidth=7;g.strokeStyle='rgba(255,255,255,.9)';g.strokeText(t,256,60);g.fillStyle='#222';g.fillText(t,256,60);
  const p=new THREE.Mesh(new THREE.PlaneGeometry(2.4,.45),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}));p.rotation.x=-Math.PI/2;p.position.set(x/100,.02,z/100);labels.add(p)}
label('Dormitorio 1 · 16.96 m²',215,250);label('Dormitorio 2 · 16 m²',215,1010);label('Sala y cocina · 38.32 m²',1040,370);label('Oficina · 9.2 m²',1000,1100);label('Recibidor · 10 m²',627,550);label('Patio · 13.12 m²',627,960);label('Baño · 4.76 m²',160,540);label('Baño · 4.76 m²',160,715);

// Cámara y controles
let az=.4,el=1.05,dist=20;const target=new THREE.Vector3(C.x,.4,C.z);
function place(){cam.position.set(target.x+dist*Math.sin(az)*Math.cos(el),target.y+dist*Math.sin(el),target.z+dist*Math.cos(az)*Math.cos(el));cam.lookAt(target)}
const V={v1:[.4,1.05,20,6.27,6.15],v2:[.5,.6,8,10.4,5],v3:[-.4,.7,9,2.1,6.1]};
Object.keys(V).forEach(k=>document.getElementById(k).onclick=()=>{const v=V[k];az=v[0];el=v[1];dist=v[2];target.set(v[3],.4,v[4])});
const modes=[['completas',1],['cortadas',.42],['planta',.01]];let mi=0;
document.getElementById('vw').onclick=e=>{mi=(mi+1)%3;walls.scale.y=modes[mi][1];e.target.textContent='Paredes: '+modes[mi][0]};
document.getElementById('vl').onclick=()=>labels.visible=!labels.visible;
const cv=renderer.domElement,pts=new Map();let last=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);last=0});
cv.addEventListener('pointerup',e=>pts.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
  if(pts.size===1){az-=(e.clientX-p[0])*.006;el=Math.max(.05,Math.min(1.5,el+(e.clientY-p[1])*.005))}
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(last)dist=Math.max(2,Math.min(35,dist*last/d));last=d}});
cv.addEventListener('wheel',e=>{dist=Math.max(2,Math.min(35,dist*(1+e.deltaY*.001)));e.preventDefault()},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
(function loop(){place();renderer.render(scene,cam);requestAnimationFrame(loop)})();
</script>
</body>
</html>
